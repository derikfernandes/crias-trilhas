<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<script src="./doc-page.js"></script>
<style>doc-page:not(:defined){visibility:hidden}body{margin:0;font-family:"Manrope",system-ui,sans-serif;color:#001c0e}a{color:#00835b}a:hover{color:#006246}</style>
</helmet>
<doc-page margin="0.7in">
  <div style="display:flex;align-items:center;gap:12px;padding-bottom:10px;border-bottom:2px solid #001c0e;margin-bottom:8px">
    <img src="assets/crias-logo-dark.png" alt="Crias" style="height:20px;width:auto">
    <span style="font-size:10pt;font-weight:700;color:#5b5b53">Guia de implementação do frontend · set. 2026</span>
  </div>
  <div ref="{{ bodyRef }}" style="font-family:'Manrope',system-ui,sans-serif;font-size:10.5pt;line-height:1.5;color:#001c0e">Carregando…</div>
</doc-page>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  bodyRef = React.createRef();
  async componentDidMount() {
    const md = await (await fetch('README-IMPLEMENTACAO.md')).text();
    if (this.bodyRef.current) this.bodyRef.current.innerHTML = this.toHtml(md);
  }
  inline(s) {
    s = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const codes = [];
    s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    return s.replace(/\u0000(\d+)\u0000/g, (m, n) => '<code style="font-family:ui-monospace,Consolas,monospace;font-size:.88em;background:#f6f2e3;padding:0 3px">' + codes[+n] + '</code>');
  }
  toHtml(md) {
    const L = md.split('\n'), out = []; let i = 0;
    const H = { 1: 'font-size:24pt;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:10pt 0 4pt', 2: 'font-size:15pt;font-weight:800;margin:4pt 0 6pt;color:#5b5b53', 3: 'font-size:13pt;font-weight:800;margin:16pt 0 6pt;padding-bottom:4pt;border-bottom:2px solid #001c0e;break-after:avoid' };
    const H3 = 'font-size:11pt;font-weight:800;margin:12pt 0 4pt;break-after:avoid';
    while (i < L.length) {
      const l = L[i];
      if (l.trim().startsWith('```')) { const ind = l.match(/^\s*/)[0].length; const b = []; i++; while (i < L.length && !L[i].trim().startsWith('```')) b.push(L[i++].slice(ind)); i++; out.push('<pre style="font-family:ui-monospace,Consolas,monospace;font-size:8.5pt;line-height:1.45;background:#f6f2e3;padding:8pt 10pt;margin:6pt 0;white-space:pre-wrap;break-inside:avoid">' + b.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre>'); continue; }
      const h = l.match(/^(#{1,4}) (.*)/);
      if (h) { const n = h[1].length; out.push(`<h${n} style="${n === 4 ? H3 : n === 3 ? H3 : n === 2 && i > 3 ? H[3] : H[n]}">${this.inline(h[2])}</h${n}>`); i++; continue; }
      if (/^---\s*$/.test(l)) { i++; continue; }
      if (l.startsWith('|')) { const rows = []; while (i < L.length && L[i].startsWith('|')) rows.push(L[i++]); const cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim()); const head = cells(rows[0]); const body = rows.slice(2).map(cells);
        out.push('<table style="width:100%;border-collapse:collapse;margin:6pt 0 10pt;font-size:9pt;line-height:1.4"><thead><tr>' + head.map(c => `<th style="text-align:left;padding:4pt 6pt 4pt 0;border-bottom:2px solid #001c0e;font-size:8pt;text-transform:uppercase;letter-spacing:.05em">${this.inline(c)}</th>`).join('') + '</tr></thead><tbody>' + body.map(r => '<tr style="break-inside:avoid">' + r.map(c => `<td style="padding:4pt 6pt 4pt 0;border-bottom:1px solid #dcd8cb;vertical-align:top">${this.inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>'); continue; }
      if (/^\s*(- |\d+\. )/.test(l)) { const ord = /^\s*\d+\. /.test(l); const items = []; while (i < L.length && (/^\s*(- |\d+\. )/.test(L[i]) || (/^\s{2,}\S/.test(L[i]) && !L[i].trim().startsWith('```')))) { const t = L[i]; if (/^\s*(- |\d+\. )/.test(t)) items.push(t.replace(/^\s*(- |\d+\. )/, '')); else items[items.length - 1] += ' ' + t.trim(); i++; }
        const tag = ord ? 'ol' : 'ul'; out.push(`<${tag} style="margin:4pt 0 8pt;padding-left:16pt">` + items.map(t => `<li style="margin:2pt 0">${this.inline(t)}</li>`).join('') + `</${tag}>`); continue; }
      if (!l.trim()) { i++; continue; }
      const p = []; while (i < L.length && L[i].trim() && !/^(#|\||\s*```|\s*- |\s*\d+\. |---)/.test(L[i])) p.push(L[i++]);
      out.push(`<p style="margin:4pt 0 8pt">${this.inline(p.join(' '))}</p>`);
    }
    return out.join('');
  }
  renderVals() { return { bodyRef: this.bodyRef }; }
}
</script>
</body>
</html>
